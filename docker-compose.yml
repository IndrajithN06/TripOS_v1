# Local infrastructure only. Ports are offset to avoid clashing with other local Postgres instances.
services:
  postgres:
    image: postgres:16-alpine
    container_name: tripos-postgres
    environment:
      POSTGRES_USER: tripos
      POSTGRES_PASSWORD: tripos_dev_only
      POSTGRES_DB: tripos
    ports: ["5442:5432"]
    volumes:
      - tripos_pg:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripos"]
      interval: 5s
      retries: 10
volumes:
  tripos_pg:
